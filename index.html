<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matacomerç</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f8f8f8;
            overflow: hidden;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
        }

        /* HEADER */
        .header {
            background: white;
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            z-index: 100;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1B5E20;
        }

        /* CONTENIDO PRINCIPAL */
        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .view {
            display: none;
            height: 100%;
            overflow-y: auto;
        }

        .view.active {
            display: block;
        }

        /* MAPA */
        #mapa {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        /* LISTA */
        .lista-content {
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mapa-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .search-box {
            margin-bottom: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 24px;
            font-size: 16px;
            background: #f5f5f5;
        }

        .search-box input::placeholder {
            color: #999;
        }

        .filtros {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 8px;
        }

        .filtro-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: white;
            color: #333;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filtro-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .comercio-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            align-items: center;
        }

        .comercio-card:active {
            background: #f9f9f9;
            transform: scale(0.98);
        }

        .comercio-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #E8F5E9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .comercio-info {
            flex: 1;
        }

        .comercio-nombre {
            font-weight: 600;
            font-size: 16px;
            color: #000;
        }

        .comercio-tipo {
            font-size: 12px;
            color: #4CAF50;
            font-weight: 500;
        }

        .comercio-horario {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }

        .fav-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: none;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ddd;
            flex-shrink: 0;
        }

        .fav-btn.favorited {
            color: #4CAF50;
        }

        /* DETALLE */
        .detalle-content {
            padding: 16px;
        }

        .detalle-header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            gap: 12px;
        }

        .detalle-back {
            width: 40px;
            height: 40px;
            border: none;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
        }

        .detalle-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: #E8F5E9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .detalle-nombre {
            font-size: 24px;
            font-weight: 700;
            color: #000;
        }

        .detalle-tipo {
            font-size: 14px;
            color: #4CAF50;
            font-weight: 500;
            margin-top: 4px;
        }

        .detalle-section {
            margin-bottom: 24px;
        }

        .detalle-section-title {
            font-size: 14px;
            font-weight: 600;
            color: #1B5E20;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detalle-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .detalle-item-icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
            color: #4CAF50;
        }

        .detalle-item-text {
            font-size: 16px;
            color: #333;
        }

        .btn-navegar {
            width: 100%;
            padding: 14px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
        }

        .btn-navegar:active {
            background: #45a049;
        }

        /* FAVORITOS */
        .favoritos-content {
            padding: 16px;
        }

        .favoritos-empty {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .favoritos-empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* OFERTAS */
        .ofertas-content {
            padding: 16px;
        }

        .ofertas-empty {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .ofertas-empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* MAS */
        .mas-content {
            padding: 16px;
        }

        .mas-section-title {
            font-size: 14px;
            font-weight: 600;
            color: #1B5E20;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mas-item-option {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .idioma-btn {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .idioma-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .idioma-btn:hover:not(.active) {
            border-color: #4CAF50;
        }

        .mas-item {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 16px;
            color: #333;
        }

        /* NAVEGACIÓN INFERIOR */
        .navbar {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #e0e0e0;
            background: white;
            padding-bottom: max(0px, env(safe-area-inset-bottom));
        }

        .nav-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #999;
            transition: all 0.2s;
        }

        .nav-btn.active {
            color: #4CAF50;
        }

        .nav-icon {
            font-size: 24px;
            width: 24px;
            height: 24px;
            color: currentColor;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 20px;
            }

            .detalle-nombre {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <div class="header">
            <div class="header h1" style="margin: 0;">Matacomerç</div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="content">
            <!-- VISTA MAPA + LISTA (combinadas) -->
            <div id="vistaLista" class="view active">
                <div class="lista-content">
                    <div class="mapa-container">
                        <div id="mapa"></div>
                    </div>
                    <div class="search-box">
                        <input type="text" id="buscar" placeholder="Buscar comercio...">
                    </div>
                    <div class="filtros">
                        <button class="filtro-btn active" data-filtro="">Tots</button>
                        <button class="filtro-btn" data-filtro="Supermercado">Supermercat</button>
                        <button class="filtro-btn" data-filtro="Farmacia">Farmàcia</button>
                        <button class="filtro-btn" data-filtro="Carnicería">Carniceria</button>
                        <button class="filtro-btn" data-filtro="Pescadería">Peixateria</button>
                    </div>
                    <div id="listado"></div>
                </div>
            </div>

            <!-- VISTA DETALLE -->
            <div id="vistaDetalle" class="view">
                <div class="detalle-content">
                    <div class="detalle-header">
                        <button class="detalle-back" onclick="mostrarVista('lista')">←</button>
                        <div></div>
                    </div>
                    <div id="detalleContenido"></div>
                </div>
            </div>

            <!-- VISTA FAVORITOS -->
            <div id="vistaFavoritos" class="view">
                <div class="favoritos-content">
                    <div id="favoritosList"></div>
                </div>
            </div>

            <!-- VISTA OFERTAS -->
            <div id="vistaOfertas" class="view">
                <div class="ofertas-content">
                    <div class="ofertas-empty">
                        <div class="ofertas-empty-icon">🎉</div>
                        <div>Pròximament: ofertes especials</div>
                        <p style="font-size: 14px; color: #999; margin-top: 16px;">Els comercis locals podran publicar les seves millors ofertes aquí.</p>
                    </div>
                </div>
            </div>

            <!-- VISTA MAS -->
            <div id="vistaMas" class="view">
                <div class="mas-content">
                    <div class="mas-section-title">Idioma</div>
                    <div class="mas-item-option">
                        <button id="btnCatalan" class="idioma-btn active" onclick="cambiarIdioma('ca')">Català</button>
                        <button id="btnCastell" class="idioma-btn" onclick="cambiarIdioma('es')">Castellano</button>
                    </div>
                    
                    <div class="mas-section-title" style="margin-top: 32px;">Pròximament</div>
                    <div class="mas-item">📸 Fotos de comercios</div>
                    <div class="mas-item">⭐ Reseñas y valoraciones</div>
                    <div class="mas-item">📱 Notificaciones</div>
                </div>
            </div>
        </div>

        <!-- NAVEGACIÓN INFERIOR -->
        <div class="navbar">
            <button class="nav-btn active" data-view="lista">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 9h18v2H3V9zm0 5h18v2H3v-2zM3 4h18v2H3V4zm0 11h18v2H3v-2z"/>
                </svg>
                <span>Inici</span>
            </button>
            <button class="nav-btn" data-view="favoritos">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
                <span>Favorits</span>
            </button>
            <button class="nav-btn" data-view="ofertas">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <span>Ofertes</span>
            </button>
            <button class="nav-btn" data-view="mas">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="2"/>
                    <circle cx="19" cy="12" r="2"/>
                    <circle cx="5" cy="12" r="2"/>
                </svg>
                <span>Més</span>
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>

        // LOGOS 48x48 para LISTA - en carpeta files/
        const logosMap48 = {
            "Condis": "files/condis_48x48.png",
            "Cal Ricard": "files/cal_ricard_48x48.png",
            "Bonprix super-market": "files/bonprix_48x48.png",
            "Bonpreu": "files/bonpreu_48x48.png",
            "Farmacia la mola": "files/farmacia-lamola_48x48.png",
            "Farmacia Matadepera": "files/farmacia-matadepera_48x48.png",
            "Carnicería Planells": "files/planell_48x48.png",
            "TeleKebab Matadepera": "files/telekebab_48x48.png",
            "Torrents Pescadería": "files/torrents_48x48.png",
            "Cal Trapet": "files/cal-trapet_48x48.png",
            "Croquis": "files/croquis_48x48.png",
        };

        // LOGOS GRANDES para DETALLE - en raíz
        const logosMapGrandes = {
            "Condis": "condis.png",
            "Cal Ricard": "cal ricardo.png",
            "Bonprix super-market": "bonprix.png",
            "Bonpreu": "bonpreu.png",
            "Farmacia la mola": "farmacia-lamola.png",
            "Farmacia Matadepera": "farmacia-matadepera.png",
            "Carnicería Planells": "planell.png",
            "TeleKebab Matadepera": "telekebab.png",
            "Torrents Pescadería": "torrents.png",
            "Cal Trapet": "cal-trapet.png",
            "Croquis": "croquis.png",
        };

        // Obtener logo pequeño (lista)
        function getLogo48(nombre) {
            return logosMap48[nombre] || null;
        }

        // Obtener logo grande (detalle)
        function getLogoGrande(nombre) {
            return logosMapGrandes[nombre] || null;
        }

        const comercios = [
            {
                id: 1,
                nombre: "Condis",
                tipo: "Supermercado",
                telefono: "937 870 032",
                horario: "9:00 - 20:30",
                latitud: 41.59919607522293,
                longitud: 2.0255916120047486,
                icono: "🛒"
            },
            {
                id: 2,
                nombre: "Cal Ricard",
                tipo: "Supermercado",
                telefono: "931 866 542",
                horario: "8:30 - 14:00 / 14:00 - 20:30",
                latitud: 41.59965157598037,
                longitud: 2.026824357900842,
                icono: "🛒"
            },
            {
                id: 3,
                nombre: "Bonprix super-market",
                tipo: "Supermercado",
                telefono: "666 336 521",
                horario: "7:00 - 0:00",
                latitud: 41.59978278300024,
                longitud: 2.026638923447957,
                icono: "🛒"
            },
            {
                id: 4,
                nombre: "Bonpreu",
                tipo: "Supermercado",
                telefono: "937 099 793",
                horario: "9:00 - 21:30",
                latitud: 41.59205940909153,
                longitud: 2.01920107692003,
                icono: "🛒"
            },
            {
                id: 5,
                nombre: "Farmacia la mola",
                tipo: "Farmacia",
                telefono: "937 301 720",
                horario: "9:00 - 13:30 / 16:30 - 20:00",
                latitud: 41.60241421066418,
                longitud: 2.0237166539597995,
                icono: "💊"
            },
            {
                id: 6,
                nombre: "Farmacia Matadepera",
                tipo: "Farmacia",
                telefono: "937 870 001",
                horario: "9:00 - 13:30 / 16:30 - 20:00",
                latitud: 41.59976565729875,
                longitud: 2.0259311203963515,
                icono: "💊"
            },
            {
                id: 7,
                nombre: "Carnicería Planells",
                tipo: "Carnicería",
                telefono: "608 917 826",
                horario: "8:30 - 14:00 / 17:00 - 20:00",
                latitud: 41.59886906615825,
                longitud: 2.026983931907679,
                icono: "🥩"
            },
            {
                id: 8,
                nombre: "TeleKebab Matadepera",
                tipo: "Bar-Restaurante",
                telefono: "936 043 190",
                horario: "11:30 - 24:00",
                latitud: 41.59927314618774,
                longitud: 2.0265749806198303,
                icono: "🍽️"
            },
            {
                id: 9,
                nombre: "Torrents Pescadería",
                tipo: "Pescadería",
                telefono: "937 871 842",
                horario: "8:30 - 15:00 / 17:00 - 20:00",
                latitud: 41.599311966570575,
                longitud: 2.0273397488654115,
                icono: "🐟"
            },
            {
                id: 10,
                nombre: "Cal Trapet",
                tipo: "Bar-Restaurante",
                telefono: "937 870 105",
                horario: "8:00 - 14:00 / 17:00 - 20:00",
                latitud: 41.59957188050739,
                longitud: 2.027084575965404,
                icono: "🍽️"
            },
            {
                id: 11,
                nombre: "Croquis",
                tipo: "Otros",
                telefono: "(consultar)",
                horario: "10:00 - 13:30 / 16:30 - 20:00",
                latitud: 41.59928734710601,
                longitud: 2.026584558273998,
                icono: "🏪"
            }
        ];

        let favoritos = JSON.parse(localStorage.getItem('favoritos')) || [];
        let filtroActual = '';
        let mapaInstance;

        // INICIALIZAR MAPA
        function initMapa() {
            mapaInstance = L.map('mapa').setView([41.5994, 2.0262], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(mapaInstance);

            comercios.forEach(comercio => {
                const marcador = L.circleMarker([comercio.latitud, comercio.longitud], {
                    radius: 8,
                    fillColor: '#4CAF50',
                    color: '#1B5E20',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                }).bindPopup(`
                    <div style="font-size: 14px;">
                        <strong>${comercio.nombre}</strong><br>
                        ${comercio.icono} ${comercio.tipo}<br>
                        📞 ${comercio.telefono}<br>
                        🕐 ${comercio.horario}
                    </div>
                `).on('click', function() {
                    mostrarDetalle(comercio.id);
                });
                marcador.addTo(mapaInstance);
            });
        }

        // MOSTRAR VISTAS
        function mostrarVista(vista) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            if (vista === 'lista') {
                document.getElementById('vistaLista').classList.add('active');
                document.querySelector('[data-view="lista"]').classList.add('active');
                if (!mapaInstance) initMapa();
                setTimeout(() => mapaInstance.invalidateSize(), 100);
                renderLista();
            } else if (vista === 'favoritos') {
                document.getElementById('vistaFavoritos').classList.add('active');
                document.querySelector('[data-view="favoritos"]').classList.add('active');
                renderFavoritos();
            } else if (vista === 'ofertas') {
                document.getElementById('vistaOfertas').classList.add('active');
                document.querySelector('[data-view="ofertas"]').classList.add('active');
            } else if (vista === 'mas') {
                document.getElementById('vistaMas').classList.add('active');
                document.querySelector('[data-view="mas"]').classList.add('active');
            }
        }

        // RENDER LISTA
        function renderLista() {
            const filtrados = filtroActual 
                ? comercios.filter(c => c.tipo === filtroActual)
                : comercios;

            const html = filtrados.map(c => {
                const logoUrl = getLogo48(c.nombre);
                return `
                    <div class="comercio-card" onclick="mostrarDetalle(${c.id})">
                        ${logoUrl 
                            ? `<img src="${logoUrl}" style="width: 48px; height: 48px; border-radius: 12px; object-fit: contain; flex-shrink: 0;" alt="${c.nombre}">` 
                            : `<div class="comercio-icon">${c.icono}</div>`}
                        <div class="comercio-info">
                            <div class="comercio-nombre">${c.nombre}</div>
                            <div class="comercio-tipo">${c.tipo}</div>
                            <div class="comercio-horario">🕐 ${c.horario}</div>
                        </div>
                        <button class="fav-btn ${favoritos.includes(c.id) ? 'favorited' : ''}" 
                            onclick="event.stopPropagation(); toggleFavorito(${c.id})">
                            ${favoritos.includes(c.id) ? '❤️' : '🤍'}
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('listado').innerHTML = html || '<div style="padding: 20px; text-align: center; color: #999;">No hay comercios</div>';
        }

        // RENDER FAVORITOS
        function renderFavoritos() {
            const favComercio = comercios.filter(c => favoritos.includes(c.id));
            
            if (favComercio.length === 0) {
                document.getElementById('favoritosList').innerHTML = `
                    <div class="favoritos-empty">
                        <div class="favoritos-empty-icon">❤️</div>
                        <div>No tens favorits</div>
                    </div>
                `;
                return;
            }

            const html = favComercio.map(c => {
                const logoUrl = getLogo48(c.nombre);
                return `
                    <div class="comercio-card" onclick="mostrarDetalle(${c.id})">
                        ${logoUrl 
                            ? `<img src="${logoUrl}" style="width: 48px; height: 48px; border-radius: 12px; object-fit: contain; flex-shrink: 0;" alt="${c.nombre}">` 
                            : `<div class="comercio-icon">${c.icono}</div>`}
                        <div class="comercio-info">
                            <div class="comercio-nombre">${c.nombre}</div>
                            <div class="comercio-tipo">${c.tipo}</div>
                            <div class="comercio-horario">🕐 ${c.horario}</div>
                        </div>
                        <button class="fav-btn favorited" 
                            onclick="event.stopPropagation(); toggleFavorito(${c.id})">
                            ❤️
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('favoritosList').innerHTML = html;
        }

        // MOSTRAR DETALLE
        function mostrarDetalle(id) {
            const comercio = comercios.find(c => c.id === id);
            const logoUrl = getLogoGrande(comercio.nombre);
            
            const html = `
                <div style="text-align: center; margin-bottom: 24px;">
                    ${logoUrl ? `<img src="${logoUrl}" style="max-width: 100%; height: auto; max-height: 180px; margin-bottom: 16px; border-radius: 8px; object-fit: contain;" alt="${comercio.nombre}">` : `<div class="detalle-icon" style="margin: 0 auto; margin-bottom: 16px;">${comercio.icono}</div>`}
                    <div class="detalle-nombre">${comercio.nombre}</div>
                    <div class="detalle-tipo">${comercio.tipo}</div>
                </div>

                <div class="detalle-section">
                    <div class="detalle-section-title">Contacte</div>
                    <div class="detalle-item">
                        <div class="detalle-item-icon">📞</div>
                        <div class="detalle-item-text">${comercio.telefono}</div>
                    </div>
                </div>

                <div class="detalle-section">
                    <div class="detalle-section-title">Horari</div>
                    <div class="detalle-item">
                        <div class="detalle-item-icon">🕐</div>
                        <div class="detalle-item-text">${comercio.horario}</div>
                    </div>
                </div>

                <button class="btn-navegar" onclick="abrirNavegador(${comercio.latitud}, ${comercio.longitud}, '${comercio.nombre}')">
                    📍 Navegar a ${comercio.nombre}
                </button>
            `;

            document.getElementById('detalleContenido').innerHTML = html;
            document.getElementById('vistaDetalle').classList.add('active');
            document.querySelectorAll('.view').forEach(v => {
                if (v.id !== 'vistaDetalle') v.classList.remove('active');
            });
        }

        // TOGGLE FAVORITO
        function toggleFavorito(id) {
            const index = favoritos.indexOf(id);
            if (index > -1) {
                favoritos.splice(index, 1);
            } else {
                favoritos.push(id);
            }
            localStorage.setItem('favoritos', JSON.stringify(favoritos));
            renderLista();
        }

        // NAVEGAR
        function abrirNavegador(lat, lng, nombre) {
            const url = `https://www.google.com/maps/search/${encodeURIComponent(nombre)}/@${lat},${lng},17z`;
            window.open(url, '_blank');
        }

        // NAVEGACIÓN
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const view = btn.dataset.view;
                if (view === 'lista') mostrarVista('lista');
                else if (view === 'favoritos') mostrarVista('favoritos');
                else if (view === 'ofertas') mostrarVista('ofertas');
                else if (view === 'mas') mostrarVista('mas');
            });
        });

        // CAMBIAR IDIOMA
        function cambiarIdioma(idioma) {
            document.getElementById('btnCatalan').classList.remove('active');
            document.getElementById('btnCastell').classList.remove('active');
            
            if (idioma === 'ca') {
                document.getElementById('btnCatalan').classList.add('active');
                console.log('Idioma cambiado a Català');
            } else if (idioma === 'es') {
                document.getElementById('btnCastell').classList.add('active');
                console.log('Idioma cambiado a Castellano');
            }
        }

        // FILTROS
        document.querySelectorAll('.filtro-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filtroActual = btn.dataset.filtro;
                renderLista();
            });
        });

        // BUSCAR
        document.getElementById('buscar').addEventListener('input', (e) => {
            const search = e.target.value.toLowerCase();
            const filtrados = comercios.filter(c => 
                c.nombre.toLowerCase().includes(search) &&
                (!filtroActual || c.tipo === filtroActual)
            );

            const html = filtrados.map(c => {
                const logoUrl = getLogo48(c.nombre);
                return `
                    <div class="comercio-card" onclick="mostrarDetalle(${c.id})">
                        ${logoUrl 
                            ? `<img src="${logoUrl}" style="width: 48px; height: 48px; border-radius: 12px; object-fit: contain; flex-shrink: 0;" alt="${c.nombre}">` 
                            : `<div class="comercio-icon">${c.icono}</div>`}
                        <div class="comercio-info">
                            <div class="comercio-nombre">${c.nombre}</div>
                            <div class="comercio-tipo">${c.tipo}</div>
                            <div class="comercio-horario">🕐 ${c.horario}</div>
                        </div>
                        <button class="fav-btn ${favoritos.includes(c.id) ? 'favorited' : ''}" 
                            onclick="event.stopPropagation(); toggleFavorito(${c.id})">
                            ${favoritos.includes(c.id) ? '❤️' : '🤍'}
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('listado').innerHTML = html;
        });

       // INICIALIZAR CUANDO EL DOM ESTÉ LISTO
        document.addEventListener('DOMContentLoaded', function() {
            initMapa();
            renderLista();
        });
    </script>
</body>
</html>
